databases:
  - name: rumiware-schoolos-db
    databaseName: schoolos
    user: schoolos
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: rumiware-schoolos
    runtime: python
    plan: 0.5c-512mb
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py sync_roles
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: rumiware-schoolos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOW_DEMO_DATA
        value: "False"
      - key: TRUST_PROXY_HTTPS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
