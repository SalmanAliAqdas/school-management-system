name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: schoolos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://schoolos:ci-only-ephemeral-password@localhost:5432/schoolos
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/repository_check.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test tests --noinput
