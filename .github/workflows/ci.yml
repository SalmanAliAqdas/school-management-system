name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: schoolos_ci
          POSTGRES_PASSWORD: bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: schoolos_ci
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - name: Configure isolated CI database credentials
        env:
          CI_POSTGRES_BOOTSTRAP_PASSWORD: bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: python scripts/configure_ci_database.py
      - run: python scripts/repository_check.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check
      - name: Check hardened production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DEBUG: "False"
          ALLOW_DEMO_DATA: "False"
          SECRET_KEY: ci-only-not-a-production-secret-000000000000000000000000000000
          ALLOWED_HOSTS: schoolos.example.invalid
          CSRF_TRUSTED_ORIGINS: https://schoolos.example.invalid
        run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python manage.py operational_check
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test tests --noinput
