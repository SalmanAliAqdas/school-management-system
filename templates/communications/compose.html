{% extends 'operations/base.html' %}{% block operations %}<header class="page-heading"><div><h1>New conversation</h1><p>Select a child first to load currently authorized family contacts, or choose staff communication.</p></div></header><form method="get" class="op-actions"><label for="child">Conversation context</label><select id="child" name="student"><option value="">Staff communication</option>{% for child in children %}<option value="{{ child.pk }}" {% if child == selected_child %}selected{% endif %}>{{ child }}</option>{% endfor %}</select><button class="btn btn-outline-secondary">Load contacts</button></form><section class="op-card"><form method="post" enctype="multipart/form-data" class="operation-form">{% include 'operations/form_fields.html' %}<button class="btn btn-primary">Send message</button></form></section>{% endblock %}
