{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field-group"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-indicator" aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="form-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="field-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
