{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination-bar" aria-label="Page navigation"><span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?q={{ query|urlencode }}&amp;status={{ status_filter|urlencode }}&amp;page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?q={{ query|urlencode }}&amp;status={{ status_filter|urlencode }}&amp;page={{ page_obj.next_page_number }}">Next →</a>{% endif %}</div></nav>{% endif %}
