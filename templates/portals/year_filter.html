<form method="get" class="portal-filters"><div><label for="academic-year">Academic year</label><select class="form-select" name="academic_year" id="academic-year">{% for option in years %}<option value="{{ option.pk }}" {% if option.pk == year.pk %}selected{% endif %}>{{ option }}</option>{% empty %}<option value="">No academic years</option>{% endfor %}</select></div>{% if active_nav == 'attendance' %}<div><label for="month">Month</label><input class="form-control" id="month" name="month" type="month" value="{{ month|date:'Y-m' }}"></div>{% endif %}<button class="btn btn-primary">Apply filters</button></form>
