{% if page.has_other_pages %}<nav class="op-actions" aria-label="Pages">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;child={{ request.GET.child|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;kind={{ request.GET.kind|urlencode }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;child={{ request.GET.child|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;kind={{ request.GET.kind|urlencode }}">Next</a>{% endif %}</nav>{% endif %}
